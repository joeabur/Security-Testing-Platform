name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default; jobs below don't need anything beyond read access.
permissions:
  contents: read

# NOTE: actions are pinned to version tags, not commit SHAs, in this Phase-1
# workflow. Full SHA-pinning (docs/BUILD_SPEC.md §23) is deferred to the
# Phase 11 supply-chain hardening pass — see docs/roadmap.md — rather than
# fabricating unverified SHAs here (a wrong SHA breaks CI outright, which is
# a worse defect than a version tag pending verification).

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kervy
          POSTGRES_PASSWORD: kervy-ci-only  # pragma: allowlist secret
          POSTGRES_DB: kervy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kervy -d kervy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://kervy:kervy-ci-only@localhost:5432/kervy_test  # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: ci
      JWT_SECRET: ci-only-secret-do-not-use-elsewhere
    steps:
      - uses: actions/checkout@v4
        # The default checkout ref on a pull_request event is GitHub's synthetic
        # merge-with-base commit, not the PR's own head — which can differ from
        # either side and makes a check red or green for a reason nobody pushed.
        # Pinned so this always tests what is actually on the branch.
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        # The AppSec scanners are installed so CI exercises the engines
        # against the lab fixtures rather than skipping them. Each adapter
        # still degrades gracefully when its tool is absent (§15), which the
        # test suite covers separately.
        #
        # -c constraints.lock.txt pins every transitive dependency to
        # uv.lock's resolved version (regenerate both via
        # `python -m scripts.relock`) instead of whatever `>=` in
        # pyproject.toml happens to resolve to on the day CI runs.
        run: pip install -c constraints.lock.txt -e ".[dev,appsec,pdf]"

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Mypy (strict)
        working-directory: backend
        run: mypy app

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Pytest
        working-directory: backend
        # §24's coverage gate, enforced rather than reported. The overall
        # threshold is the one pytest-cov can fail on directly; the per-package
        # floors (core/ and core/scope/) are checked by the step below, because
        # an overall number can stay healthy while the part that matters most
        # rots.
        run: python -m pytest -q --cov=app --cov=kervy_cli --cov=mcp_server --cov-report=term-missing
             --cov-report=json:coverage.json --cov-fail-under=80

      - name: Per-package coverage floors
        working-directory: backend
        run: python -m scripts.coverage_floors coverage.json

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The default checkout ref on a pull_request event is GitHub's synthetic
        # merge-with-base commit, not the PR's own head — which can differ from
        # either side and makes a check red or green for a reason nobody pushed.
        # Pinned so this always tests what is actually on the branch.
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
