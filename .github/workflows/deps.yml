# Dependency advisories (docs/BUILD_SPEC.md §23).
#
# Separate from `security.yml` because it fails for a different reason: not
# "we wrote something unsafe" but "something we depend on was found unsafe",
# which needs a different person and a different fix.
name: deps

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        # The default checkout ref on a pull_request event is GitHub's synthetic
        # merge-with-base commit, not the PR's own head — which can differ from
        # either side and makes a check red or green for a reason nobody pushed.
        # Pinned so this always tests what is actually on the branch.
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pip-audit
      - name: pip-audit
        # The installed set, not just the declarations, so a transitive
        # dependency cannot hide behind a clean manifest. --skip-editable
        # excludes this project's own editable install: it is not published
        # to PyPI, so pip-audit otherwise treats "not found" as a collection
        # failure for a reason unrelated to any real advisory. --strict is
        # dropped because it fails on that skip too, not just on a missing
        # audit result — with our own package always producing a skip, the
        # two flags cannot be combined, and --strict cannot be satisfied at
        # all in this setup.
        #
        # No --ignore-vuln flags: the asteval==1.0.6 pin (GHSA-9w56-46f6-3qhx)
        # that used to require one is overridden directly in pyproject.toml's
        # appsec extra (asteval>=1.0.9), and ecdsa — previously pulled in
        # transitively by an older checkov resolution (PYSEC-2026-1325) — is
        # no longer in the resolved dependency tree at all. Verified against
        # two independent installs resolving to different checkov patch
        # versions (3.2.10 and 3.2.414), neither of which pulls in a
        # vulnerable asteval or any ecdsa. If a future resolution
        # reintroduces either, this job should fail loudly rather than carry
        # a silent, stale ignore — add a new --ignore-vuln only with a fresh,
        # dated justification.
        run: |
          pip install -e ".[dev,appsec]"
          pip-audit --skip-editable --progress-spinner off

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        # The default checkout ref on a pull_request event is GitHub's synthetic
        # merge-with-base commit, not the PR's own head — which can differ from
        # either side and makes a check red or green for a reason nobody pushed.
        # Pinned so this always tests what is actually on the branch.
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
