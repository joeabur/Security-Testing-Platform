# Static analysis over this repository, using the same tools the platform's
# own AppSec engines drive (docs/BUILD_SPEC.md §23).
#
# Dogfooding on purpose: `backend/app/core/appsec/sast/rules/kervy-python.yaml`
# includes a rule that flags an ungated httpx client, which is exactly the
# mistake this codebase must never make. A security tool that does not run its
# own rules against itself is making a claim it has not tested.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published rule finds this code without waiting for
    # someone to push.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        # The default checkout ref on a pull_request event is GitHub's synthetic
        # merge-with-base commit, not the PR's own head — which can differ from
        # either side and makes a check red or green for a reason nobody pushed.
        # Pinned so this always tests what is actually on the branch.
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install analysis tools
        # bandit/semgrep are pinned via -c constraints.lock.txt, the same
        # lock the Backend (ci.yml) job installs from, so a finding here
        # can't disagree with one there over a version difference.
        #
        # detect-secrets is pinned separately, on the command line, not
        # from the lock. Its baseline file embeds the exact producing
        # version, and the hook treats *any* mismatch — including a newer
        # release — as "needs updating" and exits 3 every single run,
        # regardless of whether any secret actually changed. Bumping this
        # and `.secrets.baseline`'s `version` field together is a
        # deliberate, reviewed step, not an upstream release (or a routine
        # relock) landing silently under us — constraints.lock.txt
        # deliberately excludes it for the same reason.
        run: pip install -c constraints.lock.txt bandit semgrep detect-secrets==1.5.0

      - name: Bandit
        # Medium and above, and the whole app. `-ll` rather than a baseline
        # file: a suppression list nobody reviews is how findings get lost.
        run: bandit -r app kervy_cli -ll

      - name: Semgrep (the platform's own ruleset, offline)
        # The same local rules the SAST engine ships, so CI and the product
        # agree about what a finding is. No registry fetch: a build that
        # depends on a network call to decide whether code is safe fails for
        # reasons unrelated to the code.
        run: semgrep --config app/core/appsec/sast/rules --error --metrics=off app kervy_cli

      - name: detect-secrets
        working-directory: .
        # Against a committed baseline, not a bare scan. A bare scan fails on
        # day one over migration revision hashes, environment-variable *names*
        # like KERVY_API_KEY, and the credentials the vulnerable lab fixture
        # contains on purpose — 31 files of them here — and a job that is red
        # from the start is a job the team turns off in week one. The baseline
        # records those decisions (as hashes, never as values) so this step
        # fails only on something new. Re-audit it with
        # `detect-secrets audit .secrets.baseline`.
        #
        # On a line-number-drift failure (exit 3), the hook rewrites the
        # baseline on disk but that copy is discarded with the runner — so
        # "please git add" names no diff to act on. Show it before exiting,
        # so the fix is the printed hunk, not a guess.
        run: |
          detect-secrets-hook --baseline .secrets.baseline $(git ls-files) || {
            code=$?
            echo "::group::.secrets.baseline diff detect-secrets-hook wants"
            git --no-pager diff .secrets.baseline
            echo "::endgroup::"
            exit "$code"
          }
