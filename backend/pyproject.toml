[project]
name = "kervy-security-backend"
version = "0.1.0"
description = "Kervy Security — backend API, orchestrator, and security testing engine"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # AES-256-GCM for evidence at rest (app/core/evidence/crypto.py). Already
    # present transitively via pyjwt's crypto extra; pinned directly because
    # this project now imports it on its own, not just through pyjwt.
    "cryptography>=43",
    "celery>=5.4",
    "redis>=5.1",
    "structlog>=24.4",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "idna>=3.10",
    "pyyaml>=6.0",
    # The dashboard is server-rendered (§26 Phase 17). Jinja2 arrives
    # transitively through other packages, but the dashboard imports it
    # directly, so it is declared directly.
    "jinja2>=3.1",
    # `nmap`'s own `-oX` XML output is parsed by the VM and pentest engines
    # (Pentest module Phases 5-6). Bandit's B314 rule flags the stdlib
    # `xml.etree.ElementTree.fromstring` as XXE-capable; this is its own
    # documented drop-in replacement, already present transitively but now
    # imported directly.
    "defusedxml>=0.7",
    # RFC 6238 TOTP for two-factor login (app/core/twofactor/totp.py). A
    # narrow, widely-used implementation of one HMAC-based algorithm, used
    # in preference to hand-rolling it the way this project avoids
    # hand-rolling any other primitive built on `cryptography`/`argon2-cffi`.
    "pyotp>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "coverage>=7.6",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
    "types-defusedxml>=0.7",
]
# PDF reporting (§14). Optional because WeasyPrint needs system Pango and
# Cairo libraries; every other report format works without it, and the PDF
# endpoint says what is missing rather than failing obscurely.
pdf = [
    "weasyprint>=62",
]
# The AppSec scanners. Optional at runtime by design (§15): an adapter whose
# tool is absent reports that it did not run rather than crashing or, worse,
# returning nothing and looking clean. They are a separate extra, not part
# of `dev` — every workflow that runs the test suite must install this
# alongside `dev` (`pip install -e ".[dev,appsec]"`) or the AppSec-engine
# tests fail with "not tested" for all of them. This comment used to claim
# they were included in `dev` too; they never have been, and that claim is
# exactly what let .github/workflows/release.yml ship for a release
# installing `[dev]` alone.
appsec = [
    "semgrep>=1.90",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "checkov>=3.2",
    "detect-secrets>=1.5",
]
# Pentest module cloud engine providers (Phase 4). Optional for the same
# reason as `appsec`: the AWS provider reports "not tested" rather than
# crashing when boto3 is absent, and the base test suite never imports it
# for real — every test exercises the provider function via dependency
# injection instead.
cloud = [
    "boto3>=1.35",
]

[project.scripts]
kervy-ai = "kervy_cli.main:main"
kervy-mcp = "mcp_server.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "kervy_cli*", "mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# Celery ships no type stubs / py.typed marker, so its decorators are
# untypeable from the caller's side; scoped to app.workers rather than
# disabled globally.
[[tool.mypy.overrides]]
module = "app.workers.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

# WeasyPrint ships no py.typed marker. Optional dependency, imported in one
# function, and its return value is narrowed at the call site.
[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore_missing_imports = true

# boto3/botocore ship no py.typed marker. Optional 'cloud' extra, imported
# only inside app/core/cloud/providers/aws.py's function bodies.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.coverage.run]
# SQLAlchemy's asyncpg dialect bridges async/sync via greenlet; without this,
# coverage.py silently under-reports every line that runs inside one of
# those greenlets (most DB-touching code), since sys.settrace does not
# propagate to a new greenlet by default.
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.pytest.ini_options]
markers = [
    # The only tests that reach a real socket. Selected on their own by
    # .github/workflows/lab-e2e.yml.
    "lab_e2e: a real assessment against the demo target lab over real HTTP",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
