services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aegis:aegis-dev-only-change-me@postgres:5432/aegis}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aegis:aegis-dev-only-change-me@postgres:5432/aegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Shared with the worker: the worker writes evidence, the API serves it.
      EVIDENCE_ROOT: ${EVIDENCE_ROOT:-/var/lib/aegis/evidence}
    volumes:
      - evidence_data:/var/lib/aegis/evidence
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aegis:aegis-dev-only-change-me@postgres:5432/aegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVIDENCE_ROOT: ${EVIDENCE_ROOT:-/var/lib/aegis/evidence}
    volumes:
      - evidence_data:/var/lib/aegis/evidence
    # The worker is the only service that joins the lab network, because it is
    # the only one that reaches a target. `lab_net` has no gateway, so joining
    # it grants the worker reachability into the lab and no new reachability
    # out of the host.
    networks:
      - default
      - lab_net
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery Beat (pentest-module Phase 8): fires `dispatch_scheduled_workflows`
  # every 60s. It only ever enqueues a task for `worker` to pick up — it never
  # itself reaches a target or touches evidence — so, unlike `worker`, it
  # joins no `lab_net` and mounts no evidence volume.
  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command:
      ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    # `Dockerfile.worker`'s own HEALTHCHECK pings a *worker*'s queue, which
    # this process never runs one of — disabled rather than inherited and
    # always reporting unhealthy.
    healthcheck:
      disable: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aegis:aegis-dev-only-change-me@postgres:5432/aegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --- demo target lab (docs/BUILD_SPEC.md §19, §2.4) --------------------
  #
  # Behind `--profile demo`, so `docker compose up` never starts an
  # intentionally vulnerable application by accident. Bring it up with:
  #
  #     docker compose --profile demo up
  #
  # All three services sit on `lab_net`, which is declared `internal: true`:
  # Docker attaches no gateway to it, so nothing on it can reach the internet
  # and nothing on the internet can reach it. The worker joins that network as
  # well as the default one, which is how the scanner reaches the lab while the
  # lab reaches nothing.
  #
  # No ports are published. A vulnerable app on a host port is a vulnerable app
  # on somebody's network; use `docker compose exec` or the platform itself.

  lab-vulnerable-ai-app:
    profiles: [demo]
    build:
      context: ./demo-target
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["vulnerable-ai-app"]
    # Explicitly empty: the lab refuses to start if a provider credential is in
    # its environment, and `env_file` is deliberately absent so the project's
    # .env cannot leak one in.
    environment:
      LAB_HOST: 0.0.0.0
    networks: [lab_net]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  lab-content-server:
    profiles: [demo]
    build:
      context: ./demo-target
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["content-server"]
    environment:
      LAB_HOST: 0.0.0.0
    networks: [lab_net]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  lab-web-app:
    profiles: [demo]
    build:
      context: ./demo-target
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["web-app"]
    environment:
      LAB_HOST: 0.0.0.0
    networks: [lab_net]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  lab-collaborator:
    profiles: [demo]
    build:
      context: ./demo-target
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["collaborator"]
    environment:
      LAB_HOST: 0.0.0.0
    networks: [lab_net]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
  # Evidence bundles and their manifests. Unencrypted by design and honestly
  # documented as such (docs/BUILD_SPEC.md §13, docs/roadmap.md): treat this
  # volume like a log of production traffic.
  evidence_data:

networks:
  # The demo lab's network. `internal: true` means Docker attaches no gateway:
  # nothing on this network can reach the internet, and nothing outside can
  # reach it. That is the §2.4 isolation requirement, enforced by the network
  # rather than promised in a README.
  lab_net:
    internal: true
